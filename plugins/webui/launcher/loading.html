<!DOCTYPE html>
<!--
  The page someone sees while the sandbox starts: the first thing in the
  browser after a double-click on its icon, before the sandbox itself is
  ready. launcher.py fills in the three {{…}} markers and serves it on the
  sandbox's own address, so that when the sandbox takes over that address,
  reloading this page is all it takes to arrive there.

  It asks /__loading every half a second. An answer from launcher.py updates
  the words; no answer at all is the moment between launcher.py letting go of
  the address and the sandbox picking it up, so it keeps asking; any other
  answer means the sandbox is there, and the page reloads onto it — which is
  the passphrase screen, or first-time setup. An answer naming a different
  address means the sandbox's port turned out to be another one, and the
  page goes there.

  The same page, filled in with watching turned off, is what launcher.py
  opens straight from disk to say why the sandbox could not be started.

  And opened from disk without being filled in at all, it explains that no
  Python could be found. Only open-sandbox.sh does that, and only when there
  is no Python to run launcher.py with — so the words for it are here, in
  the one file that needs nothing to show them.

  It stands on its own: launcher.py serves it with nothing else, so the colours
  are written out here rather than taken from the web interface's design
  system. They are that system's values.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting the sandbox — Princeton University AI Sandbox</title>
<style>
  :root {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --track: #d2d2d7;
    --orange: #e67300;
    --danger-text: #d70015;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --text: #f5f5f7;
      --text-muted: #a1a1a6;
      --track: #3a3a3c;
      --orange: #E77500;
      --danger-text: #ff6961;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    box-sizing: border-box;
  }
  main { width: 100%; max-width: 34rem; text-align: center; overflow-wrap: anywhere; }
  .mark { width: 96px; height: 96px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
  p { font-size: 1rem; line-height: 1.5; color: var(--text-muted); margin: 0.5rem 0; }
  p:empty { display: none; }
  .problem h1 { color: var(--danger-text); }
  .log { font-size: 0.875rem; }
  a { color: var(--orange); }
  .spinner {
    width: 28px; height: 28px; margin: 1.5rem auto 0;
    border: 3px solid var(--track);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: turn 0.9s linear infinite;
  }
  .problem .spinner, .still .spinner { display: none; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
</style>
</head>
<body>
<main id="page">
  <svg class="mark" viewBox="0 0 132.96 132.11" aria-hidden="true">
    <path fill="#f58025" d="M83.45,0h0s-8.01,22.44-8.01,22.44h0s-12.39,9.79-27.75,3.46c-2.54-1.04-5.15-2.53-7.81-4.56-2.01-7.47-4.42-14.58-7.18-21.34h50.75Z"/>
    <path fill="#f58025" d="M107.6,50.88c9.25,1.17,14.35,19.41,18.36,35.04,5.02,19.6,7,39.85,7,39.85V4.19s-43.38,0-43.38,0l-8.01,22.44s1.91,15.67,17.27,22c2.53,1.04,5.44,1.83,8.76,2.25"/>
    <path fill="#f58025" d="M43.24,112.27c7.52-2.11,14.12-4.89,19.9-8.07,0,0-9.95-22.98-9.95-22.98l-23.07,9.25h0c1.8,5.33,4.22,10.85,7.42,16.48C26.31,109.9,13.44,112.46,0,114.66h0V5.2h27.46c2.76,6.76,5.17,13.86,7.18,21.34,0,0-5.18,8.57-7.67,22.41-1.28,7.11-1.85,15.6-.65,25.04l35.65-14.06h0s15.23,34.58,15.23,34.58h0c6.12-5.23,10.82-10.79,14.4-15.98,7.97-11.58,10.33-21.31,10.33-21.31,9.25,1.17,14.35,19.41,18.36,35.04,5.02,19.6,7,39.85,7,39.85H5.69v-12.14h0c13.44-2.2,26.31-4.75,37.55-7.7"/>
  </svg>
  <h1 id="headline">{{HEADLINE}}</h1>
  <p id="detail">{{DETAIL}}</p>
  <p id="log" class="log"></p>
  <div class="spinner" aria-hidden="true"></div>
</main>
<script type="application/json" id="state">{{STATE}}</script>
<script>
// Filled in by launcher.py. Left as it was written, it can't be read, which
// means the page was opened straight from disk by open-sandbox.sh because no
// Python could be found to run anything else.
let STATE = null;
try { STATE = JSON.parse(document.getElementById("state").textContent); }
catch (e) { STATE = null; }
if (!STATE) {
  STATE = { watch: false, log: "" };
  document.title = "Python is needed — Princeton University AI Sandbox";
  document.getElementById("headline").textContent =
    "The sandbox needs Python, and couldn't find it.";
  const detail = document.getElementById("detail");
  const link = document.createElement("a");
  link.href = "https://www.python.org/downloads/";
  link.textContent = "python.org/downloads";
  detail.replaceChildren(
    "Python is the free software the sandbox is written in, and it seems to "
    + "have been removed from this computer, or moved. Download and install "
    + "the latest version from ", link, ", then double-click the sandbox's "
    + "icon again. Nothing of yours has been lost: your settings and history "
    + "are kept separately.");
}
// How long before saying where to look, if nothing has happened. A first
// start installs nothing (the terminal did that), but a start after an update
// can, and that is several minutes of the words changing — so this counts
// only time spent with no answer at all.
const PATIENCE_MS = 120000;

const page = document.getElementById("page");
let lastHeard = Date.now();

function show(answer) {
  document.getElementById("headline").textContent = answer.headline;
  document.getElementById("detail").textContent = answer.detail || "";
  page.classList.toggle("problem", answer.phase === "problem");
  if (answer.phase === "problem") showLog();
}

function showLog() {
  if (STATE.log) {
    document.getElementById("log").textContent =
      "What happened is written down in " + STATE.log;
  }
}

function askAgainSoon() {
  if (Date.now() - lastHeard > PATIENCE_MS) {
    document.getElementById("detail").textContent =
      "This is taking longer than it should. It may still be starting; "
      + "if nothing changes in a minute or two, double-click the sandbox's "
      + "icon to try again.";
    showLog();
    page.classList.add("still");
  }
  setTimeout(ask, 500);
}

function ask() {
  fetch("/__loading", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) return null;
      return response.json().catch(function () { return null; });
    })
    .then(function (answer) {
      if (answer && answer.loading) {
        lastHeard = Date.now();
        if (answer.address && answer.address !== window.location.origin) {
          // The sandbox's port turned out to be another one. A loading page
          // is already waiting there.
          window.location.replace(answer.address);
          return;
        }
        show(answer);
        if (answer.phase !== "problem") setTimeout(ask, 500);
        return;
      }
      // Something other than start.py answered: the sandbox is there.
      window.location.reload();
    })
    .catch(askAgainSoon);
}

if (STATE.watch) {
  setTimeout(ask, 500);
} else {
  page.classList.add("problem");
  showLog();
}
</script>
</body>
</html>
