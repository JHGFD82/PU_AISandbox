<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The sandbox's icon: the mark from the unlock page, on the rounded square
    a Mac draws its applications on. start.py puts it on the shortcut it
    makes. sandbox.png, sandbox.ico and sandbox.icns beside this file are
    drawn from it. To redraw them after changing it: render this at 1024
    pixels on a transparent background (headless Chrome's screenshot option
    does this), then resize with Pillow. sandbox.icns keeps the margin a Mac
    expects and is made from an iconset folder by iconutil. sandbox.png (512
    pixels) and sandbox.ico (16, 32, 48 and 256) are cropped to the rounded
    square first, because Windows and Linux draw icons edge to edge. (Two hyphens in a row can't appear in an SVG
    comment, which is why the command-line options aren't spelled out.)
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#ffffff"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#d2d2d7"/>
  <g transform="translate(222 222) scale(4.36)">
    <path fill="#f58025" d="M83.45,0h0s-8.01,22.44-8.01,22.44h0s-12.39,9.79-27.75,3.46c-2.54-1.04-5.15-2.53-7.81-4.56-2.01-7.47-4.42-14.58-7.18-21.34h50.75Z"/>
