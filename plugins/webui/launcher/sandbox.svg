    <path fill="#f58025" d="M43.24,112.27c7.52-2.11,14.12-4.89,19.9-8.07,0,0-9.95-22.98-9.95-22.98l-23.07,9.25h0c1.8,5.33,4.22,10.85,7.42,16.48C26.31,109.9,13.44,112.46,0,114.66h0V5.2h27.46c2.76,6.76,5.17,13.86,7.18,21.34,0,0-5.18,8.57-7.67,22.41-1.28,7.11-1.85,15.6-.65,25.04l35.65-14.06h0s15.23,34.58,15.23,34.58h0c6.12-5.23,10.82-10.79,14.4-15.98,7.97-11.58,10.33-21.31,10.33-21.31,9.25,1.17,14.35,19.41,18.36,35.04,5.02,19.6,7,39.85,7,39.85H5.69v-12.14h0c13.44-2.2,26.31-4.75,37.55-7.7"/>
