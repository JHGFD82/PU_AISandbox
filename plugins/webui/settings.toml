# plugins/webui/settings.toml — defaults for the local web interface.
# Edit values directly here to change behavior (matches how
# plugins/translation/settings.toml works — there is no separate
# personal-override file for plugin-owned settings).

[webui]
# Which models the browser interface uses. Chat needs vision because a
# question there can carry a document; writing an eight-word title does not.
chat_models = ["gpt-4o-mini", "gemini-2.5-flash-lite", "gpt-4o"]
title_models = ["gpt-4o-mini", "gpt-4.1-nano", "gemini-2.5-flash-lite"]
host = "127.0.0.1"
port = 8000
session_cookie_name = "pu_sandbox_session"
# Fraction of a model's context window that triggers conversation
# compaction on the *next* turn.
compaction_threshold = 0.70
# Model used for the cheap summarization call that compaction performs.
compaction_model = "gpt-4o-mini"
# Whether to keep a copy of each document supplied to a conversation, in that
# conversation's own folder. Off by default: the text is read out of a document
# and kept in the conversation either way, so this is about having the document
# itself afterwards — worth it if the conversation is something you may need to
# show or cite, and not worth the disk if it isn't.
keep_supplied_documents = false
# Whether the file a job produces is kept in its conversation's own folder. On
# by default, so that a translation sits with the conversation that asked for
# it and the whole piece of work can be kept or cited as one thing. Turning it
# off does not throw the file away — it is kept in a folder of job results
# instead, and the link to download it goes on working. What changes is that it
# no longer travels with the conversation, and deleting the conversation no
# longer deletes it.
keep_job_outputs = true
