<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Princeton AI Sandbox</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 320px; }
  h1 { font-size: 1.1rem; margin: 0 0 1.25rem; color: #1d1d1f; }
  input[type=password] { width: 100%; padding: 0.6rem; font-size: 1rem; border: 1px solid #d2d2d7; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 1rem; width: 100%; padding: 0.6rem; font-size: 1rem; background: #E77500; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #cc6600; }
  .error { color: #d70015; font-size: 0.85rem; margin-top: 0.75rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Princeton AI Sandbox</h1>
    <form method="post" action="/unlock">
      <input type="password" name="passphrase" placeholder="Passphrase" autofocus>
      <button type="submit">Unlock</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
