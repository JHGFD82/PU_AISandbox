<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Princeton AI Sandbox</title>
<style>
  :root {
    --orange: #E77500;
    --border: #d2d2d7;
    --bg: #f5f5f7;
    --panel-bg: #ffffff;
    --input-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --active-bg: #fdeadb;
    --hover-bg: #eeeef0;
    --shadow: rgba(0, 0, 0, 0.14);
  }
  [data-theme="dark"] {
    --border: #3a3a3c;
    --bg: #1c1c1e;
    --panel-bg: #262628;
    --input-bg: #1c1c1e;
    --text: #f2f2f7;
    --text-muted: #9a9a9e;
    --active-bg: #4a2f14;
    --hover-bg: #333335;
    --shadow: rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  /* Shared by every element whose color comes from a theme variable, so
     switching data-theme fades smoothly instead of snapping instantly. */
  body, #sidebar, #spend, #topbar, #composer, .msg.assistant, .conv-item,
  .combobox-list, .model-add-popover, .conv-menu, button.secondary,
  input, select, textarea {
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; height: 100vh;
         display: grid; grid-template-columns: 240px 1fr 280px; grid-template-rows: auto 1fr;
         background: var(--bg); color: var(--text);
         transition: background-color 0.2s ease, color 0.2s ease, grid-template-columns 0.25s ease; }
  /* grid-template-columns defines a fixed 3-track layout regardless of which
     children are actually visible — hiding #spend with display:none alone
     leaves its 280px track reserved and empty instead of handing that
     space to #main. Animating the third track down to 0 (rather than
     yanking it out with display:none) is what makes #main visibly slide
     over into the reclaimed space instead of just snapping. */
  body.spend-hidden { grid-template-columns: 240px 1fr 0px; }
  #page-title-bar {
    grid-column: 1 / -1; grid-row: 1; display: flex; align-items: center;
    padding: 0.55rem 1rem; background: var(--panel-bg); border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 0.92rem; letter-spacing: 0.01em;
  }
  #sidebar, #spend { grid-row: 2; background: var(--panel-bg); border-right: 1px solid var(--border); padding: 1rem; overflow-y: auto; }
  #sidebar { display: flex; flex-direction: column; }
  #conv-list { flex: 1; overflow-y: auto; min-height: 0; }
  .sidebar-footer {
    flex: none; display: flex; gap: 0.4rem; margin-top: 0.75rem; padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }
  #spend {
    border-right: none; border-left: 1px solid var(--border); overflow: hidden;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease,
                opacity 0.2s ease, padding 0.25s ease;
  }
  body.spend-hidden #spend { opacity: 0; padding-left: 0; padding-right: 0; border-left-color: transparent; pointer-events: none; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 1rem 0 0.4rem; }
  h2:first-child { margin-top: 0; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0 0.4rem; }
  .section-header h2 { margin: 0; }
  select, input[type=text], textarea {
    width: 100%; padding: 0.45rem; font-size: 0.9rem; border: 1px solid var(--border);
    border-radius: 6px; background: var(--input-bg); color: var(--text); font-family: inherit;
  }
  .conv-item { display: flex; align-items: center; gap: 0.2rem; padding: 0.3rem 0.2rem 0.3rem 0.5rem;
               border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 0.2rem; position: relative; }
  .conv-item:hover { background: var(--hover-bg); }
  .conv-item.active { background: var(--active-bg); }
  .conv-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0.2rem 0; }
  .conv-item-title[contenteditable="true"] {
    outline: 1px solid var(--orange); border-radius: 4px; padding: 0.15rem 0.3rem;
    white-space: normal; cursor: text; background: var(--input-bg);
  }
  .conv-menu-btn {
    flex: none; width: 20px; height: 20px; padding: 0; border-radius: 4px;
    background: transparent; border: none; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0; transition: opacity 0.15s ease, background-color 0.15s ease;
  }
  .conv-item:hover .conv-menu-btn, .conv-menu-btn.menu-open { opacity: 1; }
  .conv-menu-btn:hover { background: var(--border); }
  .conv-menu-btn svg { width: 3px; height: 13px; display: block; }
  .conv-menu {
    position: absolute; top: calc(100% + 2px); right: 0.3rem; min-width: 130px;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 18px var(--shadow); z-index: 30; padding: 0.25rem;
  }
  .conv-menu[hidden] { display: none; }
  .conv-menu-option {
    display: block; width: 100%; text-align: left; padding: 0.4rem 0.6rem; font-size: 0.82rem;
    background: transparent; color: var(--text); border: none; border-radius: 4px; cursor: pointer;
  }
  .conv-menu-option:hover { background: var(--hover-bg); }
  .conv-menu-option.danger { color: #d64545; }
  [data-theme="dark"] .conv-menu-option.danger { color: #ff6b6b; }
  button { padding: 0.5rem 0.8rem; font-size: 0.85rem; background: var(--orange); color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #cc6600; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--hover-bg); }
  button:disabled { opacity: 0.5; cursor: default; }

  .plus-btn {
    width: 22px; height: 22px; padding: 0; border-radius: 6px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .plus-btn svg { width: 12px; height: 12px; display: block; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; border-radius: 6px; flex: none;
    background: transparent; border: none; color: var(--text); cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover-bg); }
  .icon-btn.neutral { color: var(--text-muted); }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .sidebar-footer .icon-btn { width: 36px; height: 36px; }
  .sidebar-footer .icon-btn svg { width: 17px; height: 17px; }
  .export-wrap { position: relative; }
  .export-wrap .conv-menu { top: calc(100% + 4px); right: 0; min-width: 150px; }
  /* Sun/moon crossfade with a little rotation instead of an instant swap.
     The icon shown is the mode you'll SWITCH TO, not the current one — sun
     while dark mode is active (click for light), moon while light mode is
     active (click for dark). */
  .icon-stack { position: relative; width: 18px; height: 18px; }
  .icon-stack svg {
    position: absolute; top: 0; left: 0; width: 18px; height: 18px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .icon-stack .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
  .icon-stack .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
  [data-theme="dark"] .icon-stack .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
  [data-theme="dark"] .icon-stack .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }
  .panel-fill { transition: fill 0.2s ease; }
  .icon-btn.collapsed .panel-fill { fill: none; }

  #main { grid-row: 2; display: flex; flex-direction: column; min-height: 0; }
  #topbar { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); background: var(--panel-bg); }
  .model-picker { flex: 1; display: flex; gap: 0.4rem; min-width: 0; }

  .combobox { position: relative; flex: 1; min-width: 0; }
  .combobox input.model-field { padding-right: 1.9rem; cursor: pointer; }
  .combobox-toggle {
    position: absolute; right: 0.35rem; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0; background: transparent; border: none; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .combobox-toggle:hover { background: transparent; color: var(--text); }
  .combobox-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 260px; overflow-y: auto;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 18px var(--shadow); z-index: 20; padding: 0.25rem; margin: 0;
  }
  .combobox-option { padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .combobox-option:hover { background: var(--hover-bg); }

  .model-add { position: relative; }
  .model-add-popover {
    position: absolute; top: calc(100% + 4px); right: 0; width: 230px; display: flex; gap: 0.4rem;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 18px var(--shadow); z-index: 20; padding: 0.5rem;
  }
  /* Without this, [hidden] and the rule above both have equal specificity
     and this stylesheet's own "display: flex" (loaded after the browser's
     built-in [hidden] rule) would win, leaving the popover visible even
     when its hidden attribute is set. */
  .model-add-popover[hidden] { display: none; }
  .model-add-popover input { padding: 0.4rem; font-size: 0.82rem; }
  .model-add-popover button { padding: 0.4rem 0.6rem; font-size: 0.8rem; flex: none; }

  #messages { flex: 1; overflow-y: auto; padding: 1.5rem; }
  .msg { max-width: 70%; margin-bottom: 1rem; padding: 0.7rem 0.9rem; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; font-size: 0.92rem; }
  .msg.user { background: var(--orange); color: white; margin-left: auto; }
  .msg.assistant { background: var(--panel-bg); border: 1px solid var(--border); }
  .msg .meta { font-size: 0.72rem; opacity: 0.7; margin-top: 0.35rem; }
  .msg .meta.waiting { font-style: italic; }

  /* Attachment chips: a small "📎 filename" pill. One flavor sits above the
     composer for a file that's been uploaded and is waiting to be sent
     (with a remove button); another, read-only flavor renders inside a
     message bubble once that turn has actually been sent. */
  .attachment-chip {
    display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.55rem;
    border-radius: 999px; font-size: 0.78rem; white-space: nowrap;
  }
  .attachment-chip svg { width: 12px; height: 12px; flex: none; }
  #attachment-chip-row { padding: 0.5rem 1rem 0; }
  #attachment-chip-row[hidden] { display: none; }
  #attachment-chip-row .attachment-chip {
    background: var(--hover-bg); border: 1px solid var(--border); color: var(--text);
  }
  #attachment-chip-row .attachment-chip button {
    padding: 0; width: 15px; height: 15px; border-radius: 50%; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.85rem;
    line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  #attachment-chip-row .attachment-chip button:hover { background: var(--border); }
  .msg-attachment-chip { background: rgba(255, 255, 255, 0.25); color: inherit; margin-top: 0.4rem; }
  .msg.assistant .msg-attachment-chip { background: var(--hover-bg); }

  #composer { display: flex; align-items: flex-end; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--border); background: var(--panel-bg); }
  #composer textarea { flex: 1; resize: none; height: 2.6rem; }
  #composer .icon-btn { flex: none; }
  .spend-figure { font-size: 1.6rem; font-weight: 600; }
  .spend-label { font-size: 0.78rem; color: var(--text-muted); }
  .spend-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.2rem 0; }
  .empty { color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 2rem; }

  /* ── Settings modal ──────────────────────────────────────────────────
     The settings page is embedded via a same-origin iframe rather than
     rebuilt as an in-page panel — same-origin means it automatically
     shares this page's localStorage, so /settings picks up the saved
     theme on its own with no cross-frame messaging needed. */
  #settings-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s ease;
  }
  #settings-modal-backdrop[hidden] { display: none; }
  #settings-modal-backdrop.open { opacity: 1; }
  .modal-panel {
    width: min(760px, 92vw); height: min(85vh, 780px); background: var(--panel-bg);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px var(--shadow); transform: scale(0.97); transition: transform 0.2s ease;
  }
  #settings-modal-backdrop.open .modal-panel { transform: scale(1); }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); background: var(--panel-bg); flex: none;
  }
  .modal-header h2 { margin: 0; }
  #settings-iframe { flex: 1; border: none; width: 100%; background: var(--panel-bg); }
</style>
</head>
<body>
  <div id="page-title-bar">Princeton University AI Sandbox Chat UI</div>
  <div id="sidebar">
    <h2>Professor</h2>
    <select id="professor-select"></select>

    <div class="section-header">
      <h2>Conversations</h2>
      <button id="new-conv" class="plus-btn" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="conv-list"></div>

    <div class="sidebar-footer">
      <button class="icon-btn neutral" id="settings-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5"/>
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5" transform="rotate(45 10 10)"/>
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5" transform="rotate(90 10 10)"/>
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5" transform="rotate(135 10 10)"/>
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5" transform="rotate(180 10 10)"/>
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5" transform="rotate(225 10 10)"/>
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5" transform="rotate(270 10 10)"/>
          <rect x="9.1" y="0.6" width="1.8" height="3" rx="0.5" transform="rotate(315 10 10)"/>
          <path fill-rule="evenodd" clip-rule="evenodd"
                d="M10 15.6a5.6 5.6 0 100-11.2 5.6 5.6 0 000 11.2zm0-3a2.6 2.6 0 100-5.2 2.6 2.6 0 000 5.2z"/>
        </svg>
      </button>
      <button class="icon-btn neutral" id="lock-btn" title="Lock" aria-label="Lock">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="9" width="11" height="8" rx="1.8"/>
          <path d="M7 9V6.5a3 3 0 016 0V9"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="model-picker">
        <div class="combobox" id="model-combobox">
          <input class="model-field" id="model-field" type="text" readonly
                 placeholder="Model (e.g. gpt-4o, anthropic/claude-fable-5)" autocomplete="off">
          <button type="button" class="combobox-toggle" id="model-toggle-btn" aria-label="Show model list" title="Show model list">
            <svg viewBox="0 0 10 6" width="10" height="6">
              <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="combobox-list" id="model-list" hidden></div>
        </div>
        <div class="model-add" id="model-add">
          <button type="button" class="icon-btn neutral" id="model-add-btn" title="Use a custom model" aria-label="Use a custom model">
            <svg viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <div class="model-add-popover" id="model-add-popover" hidden>
            <input type="text" id="model-add-input" placeholder="e.g. openai/gpt-4o" autocomplete="off">
            <button type="button" id="model-add-confirm">Use</button>
          </div>
        </div>
      </div>
      <div class="export-wrap" id="export-wrap">
        <button class="icon-btn" id="export-btn" title="Export conversation" aria-label="Export conversation">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 2.2v8.3M9 10.5l-3-3M9 10.5l3-3"/>
            <path d="M3 12.2v2a1.3 1.3 0 001.3 1.3h9.4A1.3 1.3 0 0015 14.2v-2"/>
          </svg>
        </button>
        <div class="conv-menu" id="export-menu" hidden>
          <button type="button" class="conv-menu-option" data-format="docx">Word (.docx)</button>
          <button type="button" class="conv-menu-option" data-format="pdf">PDF</button>
          <button type="button" class="conv-menu-option" data-format="md">Markdown (.md)</button>
        </div>
      </div>
      <button class="icon-btn" id="theme-toggle-btn" title="Switch to dark mode" aria-label="Toggle dark mode">
        <span class="icon-stack">
          <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="10" cy="10" r="3.6"/>
            <path d="M10 1.6v2.1M10 16.3v2.1M18.4 10h-2.1M3.7 10H1.6M15.6 4.4l-1.5 1.5M5.9 14.1l-1.5 1.5M15.6 15.6l-1.5-1.5M5.9 5.9L4.4 4.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 20 20" fill="currentColor">
            <path d="M16.2 12.9A7 7 0 018 3.9c.2-.4-.2-.9-.6-.8A8 8 0 1017 13.6c.1-.5-.4-.9-.8-.7z"/>
          </svg>
        </span>
      </button>
      <button class="icon-btn" id="spend-toggle-btn" title="Hide spend panel" aria-label="Toggle spend panel">
        <svg viewBox="0 0 18 18">
          <rect x="1.5" y="2.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <rect class="panel-fill" x="11.5" y="2.5" width="5" height="13" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div id="messages"><div class="empty">Select or start a conversation.</div></div>
    <div id="attachment-chip-row" hidden>
      <span class="attachment-chip" id="pending-attachment-chip">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.2 4.2L4.9 8.5a1.6 1.6 0 002.3 2.3l4.1-4.1a2.7 2.7 0 00-3.8-3.8L3.4 7a3.8 3.8 0 005.4 5.4L12.6 8.6"/>
        </svg>
        <span id="pending-attachment-name"></span>
        <button type="button" id="pending-attachment-remove" aria-label="Remove attachment" title="Remove attachment">&times;</button>
      </span>
    </div>
    <div id="composer">
      <button type="button" class="icon-btn neutral" id="attach-btn" title="Attach a document" aria-label="Attach a document">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.5 5.3L6.2 10.6a2.1 2.1 0 003 3l5.2-5.2a3.5 3.5 0 00-5-5L4.6 8.2a4.9 4.9 0 007 7l4.9-4.9"/>
        </svg>
      </button>
      <input type="file" id="attach-input" hidden accept=".pdf,.docx,.txt,.xlsx,.xls,.json,.md">
      <textarea id="input" placeholder="Message..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <div id="spend">
    <h2>This month</h2>
    <div class="spend-figure" id="spend-month">$0.00</div>
    <div class="spend-label" id="spend-budget"></div>
    <h2>All time</h2>
    <div class="spend-figure" id="spend-alltime">$0.00</div>
    <h2>By model (this month)</h2>
    <div id="spend-by-model"></div>
  </div>

  <div id="settings-modal-backdrop" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 style="margin:0; text-transform:none; font-size:1rem; letter-spacing:normal;">Settings</h2>
        <button type="button" class="icon-btn" id="settings-modal-close" title="Close" aria-label="Close settings">
          <svg viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <iframe id="settings-iframe" title="Settings"></iframe>
    </div>
  </div>

<script>
const state = {
  professor: null, conversationId: null, conversationModel: null, conversationHasMessages: false,
  models: [], defaultModel: null, pendingAttachment: null,
};

// ── Dark mode ────────────────────────────────────────────────────────────
// Applied immediately (before the rest of init) so there's no flash of the
// wrong theme on load. Preference is stored per-browser in localStorage —
// there's no server-side concept of "this professor's theme," it's purely
// a local display setting, so localStorage is the right place for it.
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("theme-toggle-btn");
  if (btn) btn.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
}
applyTheme(
  localStorage.getItem("theme")
  || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
);
document.getElementById("theme-toggle-btn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("theme", next);
  applyTheme(next);
});

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
  if (!res.ok) { throw new Error(await res.text()); }
  return res.json();
}

function fmtMoney(v) { return "$" + (v || 0).toFixed(2); }

async function loadProfessors() {
  const data = await api("/api/professors");
  const sel = document.getElementById("professor-select");
  sel.innerHTML = "";
  data.professors.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.safe_name; opt.textContent = p.name;
    sel.appendChild(opt);
  });
  state.professor = data.active || (data.professors[0] && data.professors[0].safe_name);
  if (state.professor) sel.value = state.professor;
  sel.addEventListener("change", async () => {
    state.professor = sel.value;
    await api("/api/active-professor", { method: "POST", body: JSON.stringify({ professor: state.professor }) });
    state.conversationId = null;
    await Promise.all([loadConversations(), loadUsage(), loadModels()]);
    renderMessages(null);
  });
}

// ── Model picker ─────────────────────────────────────────────────────────
// A hand-rolled combobox instead of <input list="..."> + <datalist>: the
// datalist popup is rendered entirely by the OS/browser chrome, not by our
// CSS, so it doesn't pick up this page's theme at all (that's what made it
// look like a stray light-mode box in dark mode). The field itself is
// read-only — clicking it (or the chevron) always shows the full list of
// known models rather than dropping into text-entry mode. Typing a model
// name that isn't in the list goes through the separate "+" popover
// instead, so there's exactly one way to pick a known model and one way to
// enter a custom one, instead of one field trying to do both.
async function loadModels() {
  const data = await api("/api/models?professor=" + encodeURIComponent(state.professor));
  state.models = data.models;
  state.defaultModel = data.default;
  renderModelList();
  const field = document.getElementById("model-field");
  if (!field.value) field.value = data.default || "";
}

function renderModelList() {
  const list = document.getElementById("model-list");
  list.innerHTML = "";
  state.models.forEach(m => {
    const opt = document.createElement("div");
    opt.className = "combobox-option";
    opt.textContent = m.name;
    opt.addEventListener("click", () => {
      document.getElementById("model-field").value = m.name;
      closeModelList();
    });
    list.appendChild(opt);
  });
}

function openModelList() {
  // Always the full list — this field is read-only, so there's no typed
  // query to narrow it by. Resetting visibility here also undoes any stale
  // filtering from a since-removed search-as-you-type version of this.
  document.querySelectorAll("#model-list .combobox-option").forEach(opt => { opt.style.display = ""; });
  document.getElementById("model-list").hidden = false;
}
function closeModelList() { document.getElementById("model-list").hidden = true; }
function toggleModelList() {
  const list = document.getElementById("model-list");
  if (list.hidden) openModelList(); else closeModelList();
}

document.getElementById("model-toggle-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  toggleModelList();
});
document.getElementById("model-field").addEventListener("click", (e) => {
  e.stopPropagation();
  toggleModelList();
});
document.getElementById("model-field").addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModelList();
});

// "+" next to the model field: a small in-app popover for typing a custom
// model name, rather than relying on people discovering that the combobox
// text field itself accepts free text.
function openModelAddPopover() {
  document.getElementById("model-add-popover").hidden = false;
  const input = document.getElementById("model-add-input");
  input.value = "";
  input.focus();
}
function closeModelAddPopover() { document.getElementById("model-add-popover").hidden = true; }
function confirmModelAdd() {
  const val = document.getElementById("model-add-input").value.trim();
  if (val) document.getElementById("model-field").value = val;
  closeModelAddPopover();
}
document.getElementById("model-add-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  const pop = document.getElementById("model-add-popover");
  if (pop.hidden) openModelAddPopover(); else closeModelAddPopover();
});
document.getElementById("model-add-confirm").addEventListener("click", confirmModelAdd);
document.getElementById("model-add-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); confirmModelAdd(); }
  if (e.key === "Escape") closeModelAddPopover();
});

document.addEventListener("click", (e) => {
  if (!document.getElementById("model-combobox").contains(e.target)) closeModelList();
  if (!document.getElementById("model-add").contains(e.target)) closeModelAddPopover();
  if (!document.getElementById("export-wrap").contains(e.target)) closeExportMenu();
  closeConvMenu();
});

// ── Export ───────────────────────────────────────────────────────────────
function closeExportMenu() { document.getElementById("export-menu").hidden = true; }
document.getElementById("export-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  if (!state.conversationId) return;
  const menu = document.getElementById("export-menu");
  menu.hidden = !menu.hidden;
});
document.getElementById("export-menu").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-format]");
  if (!btn) return;
  closeExportMenu();
  const url = `/api/conversations/${state.conversationId}/export`
    + `?professor=${encodeURIComponent(state.professor)}&format=${btn.dataset.format}`;
  window.open(url, "_blank");
});

// ── Attachments ──────────────────────────────────────────────────────────
function showPendingAttachmentChip(filename) {
  document.getElementById("pending-attachment-name").textContent = filename;
  document.getElementById("attachment-chip-row").hidden = false;
}
function clearPendingAttachment() {
  state.pendingAttachment = null;
  document.getElementById("attachment-chip-row").hidden = true;
  document.getElementById("attach-input").value = "";
}
document.getElementById("attach-btn").addEventListener("click", () => {
  document.getElementById("attach-input").click();
});
document.getElementById("pending-attachment-remove").addEventListener("click", clearPendingAttachment);
document.getElementById("attach-input").addEventListener("change", async () => {
  const input = document.getElementById("attach-input");
  const file = input.files && input.files[0];
  if (!file) return;
  const attachBtn = document.getElementById("attach-btn");
  attachBtn.disabled = true;
  showPendingAttachmentChip(`Reading ${file.name}…`);
  try {
    const form = new FormData();
    form.append("professor", state.professor);
    form.append("file", file);
    const res = await fetch("/api/attachments", { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json()).detail || "Upload failed.");
    const doc = await res.json();
    state.pendingAttachment = doc;
    showPendingAttachmentChip(`${doc.filename} (${doc.char_count.toLocaleString()} characters)`);
  } catch (e) {
    alert("Couldn't attach that file: " + e.message);
    clearPendingAttachment();
  } finally {
    attachBtn.disabled = false;
  }
});

// ── Conversation list ────────────────────────────────────────────────────
// Each row is a title (click to open, or double-click/menu to rename) plus
// a "⋮" button that only shows on hover, opening a small menu for renaming
// or deleting that one conversation.
let openConvMenu = null; // { menu, btn } for whichever conversation's menu is currently open, or null

function closeConvMenu() {
  if (!openConvMenu) return;
  openConvMenu.menu.hidden = true;
  openConvMenu.btn.classList.remove("menu-open");
  openConvMenu = null;
}

function selectAllText(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function startRenaming(titleSpan, id, currentTitle) {
  titleSpan.contentEditable = "true";
  titleSpan.textContent = currentTitle;
  titleSpan.focus();
  selectAllText(titleSpan);

  const finish = async (commit) => {
    titleSpan.removeEventListener("keydown", onKeydown);
    titleSpan.removeEventListener("blur", onBlur);
    titleSpan.contentEditable = "false";
    const newTitle = titleSpan.textContent.trim();
    if (commit && newTitle && newTitle !== currentTitle) {
      try {
        await api(`/api/conversations/${id}`, {
          method: "PATCH",
          body: JSON.stringify({ professor: state.professor, title: newTitle }),
        });
      } catch (e) {
        alert("Couldn't rename conversation: " + e.message);
      }
    }
    await loadConversations();
  };
  const onKeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") { e.preventDefault(); finish(false); }
  };
  const onBlur = () => finish(true);
  titleSpan.addEventListener("keydown", onKeydown);
  titleSpan.addEventListener("blur", onBlur);
}

async function deleteConversationFromMenu(id, title) {
  if (!confirm(`Delete "${title}"? This can't be undone.`)) return;
  await api(`/api/conversations/${id}?professor=${encodeURIComponent(state.professor)}`, { method: "DELETE" });
  if (state.conversationId === id) {
    state.conversationId = null;
    state.conversationModel = null;
    state.conversationHasMessages = false;
    renderMessages(null);
  }
  await loadConversations();
}

async function loadConversations() {
  const data = await api("/api/conversations?professor=" + encodeURIComponent(state.professor));
  const list = document.getElementById("conv-list");
  list.innerHTML = "";
  openConvMenu = null;
  data.conversations.forEach(c => {
    const item = document.createElement("div");
    item.className = "conv-item" + (c.id === state.conversationId ? " active" : "");

    const titleSpan = document.createElement("span");
    titleSpan.className = "conv-item-title";
    titleSpan.textContent = c.title;
    titleSpan.title = c.title;
    titleSpan.addEventListener("click", () => {
      if (titleSpan.isContentEditable) return;
      openConversation(c.id);
    });

    const menuBtn = document.createElement("button");
    menuBtn.type = "button";
    menuBtn.className = "conv-menu-btn";
    menuBtn.setAttribute("aria-label", "Conversation options");
    menuBtn.title = "Conversation options";
    menuBtn.innerHTML = '<svg viewBox="0 0 4 16"><circle cx="2" cy="2" r="1.6" fill="currentColor"/>'
      + '<circle cx="2" cy="8" r="1.6" fill="currentColor"/><circle cx="2" cy="14" r="1.6" fill="currentColor"/></svg>';

    const menu = document.createElement("div");
    menu.className = "conv-menu";
    menu.hidden = true;

    const renameBtn = document.createElement("button");
    renameBtn.type = "button"; renameBtn.className = "conv-menu-option"; renameBtn.textContent = "Rename";
    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button"; deleteBtn.className = "conv-menu-option danger"; deleteBtn.textContent = "Delete";
    menu.appendChild(renameBtn);
    menu.appendChild(deleteBtn);

    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const wasOpen = openConvMenu && openConvMenu.menu === menu;
      closeConvMenu();
      if (!wasOpen) {
        menu.hidden = false;
        menuBtn.classList.add("menu-open");
        openConvMenu = { menu, btn: menuBtn };
      }
    });
    renameBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeConvMenu();
      startRenaming(titleSpan, c.id, c.title);
    });
    deleteBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeConvMenu();
      deleteConversationFromMenu(c.id, c.title);
    });

    item.appendChild(titleSpan);
    item.appendChild(menuBtn);
    item.appendChild(menu);
    list.appendChild(item);
  });
}

async function loadUsage() {
  const data = await api("/api/usage?professor=" + encodeURIComponent(state.professor));
  document.getElementById("spend-month").textContent = fmtMoney(data.month.total_cost);
  document.getElementById("spend-alltime").textContent = fmtMoney(data.all_time.total_cost);
  document.getElementById("spend-budget").textContent =
    data.budget.monthly_limit ? `of ${fmtMoney(data.budget.monthly_limit)} budget (${data.budget.usage_percentage.toFixed(0)}%)` : "";
  const byModel = document.getElementById("spend-by-model");
  byModel.innerHTML = "";
  Object.entries(data.model_usage || {}).forEach(([model, stats]) => {
    const row = document.createElement("div");
    row.className = "spend-row";
    row.innerHTML = `<span>${model}</span><span>${fmtMoney(stats.total_cost)}</span>`;
    byModel.appendChild(row);
  });
}

function attachmentChipElement(filename, charCount) {
  const chip = document.createElement("span");
  chip.className = "attachment-chip msg-attachment-chip";
  chip.innerHTML = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 4.2L4.9 8.5a1.6 1.6 0 002.3 2.3l4.1-4.1a2.7 2.7 0 00-3.8-3.8L3.4 7a3.8 3.8 0 005.4 5.4L12.6 8.6"/></svg>';
  const label = document.createElement("span");
  label.textContent = charCount != null ? `${filename} (${charCount.toLocaleString()} characters)` : filename;
  chip.appendChild(label);
  return chip;
}

function renderMessages(conv) {
  const box = document.getElementById("messages");
  if (!conv) { box.innerHTML = '<div class="empty">Select or start a conversation.</div>'; return; }
  box.innerHTML = "";
  conv.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.textContent = m.content;
    (m.attachments || []).forEach(a => {
      if (m.content) div.appendChild(document.createElement("br"));
      div.appendChild(attachmentChipElement(a.filename, a.char_count));
    });
    if (m.role === "assistant" && m.cost != null) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${m.model} · ${fmtMoney(m.cost)}`;
      div.appendChild(meta);
    }
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function openConversation(id) {
  state.conversationId = id;
  clearPendingAttachment();
  const conv = await api(`/api/conversations/${id}?professor=${encodeURIComponent(state.professor)}`);
  state.conversationModel = conv.model;
  state.conversationHasMessages = conv.messages.length > 0;
  document.getElementById("model-field").value = conv.model;
  renderMessages(conv);
  await loadConversations();
}

document.getElementById("new-conv").addEventListener("click", async () => {
  const model = document.getElementById("model-field").value || state.defaultModel;
  clearPendingAttachment();
  const conv = await api("/api/conversations", {
    method: "POST",
    body: JSON.stringify({ professor: state.professor, model }),
  });
  state.conversationId = conv.id;
  state.conversationModel = conv.model;
  state.conversationHasMessages = false;
  renderMessages(conv);
  await loadConversations();
});

function appendPendingMessage(text, attachment) {
  const box = document.getElementById("messages");
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg user";
  div.textContent = text;
  if (attachment) {
    if (text) div.appendChild(document.createElement("br"));
    div.appendChild(attachmentChipElement(attachment.filename, attachment.char_count));
  }
  const meta = document.createElement("div");
  meta.className = "meta waiting";
  meta.textContent = "waiting...";
  div.appendChild(meta);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  const attachment = state.pendingAttachment;
  if (!text && !attachment) return;

  const chosenModel = document.getElementById("model-field").value || state.defaultModel;
  if (state.conversationHasMessages && state.conversationModel && chosenModel !== state.conversationModel) {
    const proceed = confirm(
      `This conversation has been using "${state.conversationModel}". ` +
      `Switching to "${chosenModel}" now won't change anything the model already said — ` +
      `the new model didn't generate those earlier replies, so it may answer inconsistently ` +
      `with them or not "remember" details the same way.\n\nSend with "${chosenModel}" anyway?`
    );
    if (!proceed) return;
  }

  if (!state.conversationId) {
    const conv = await api("/api/conversations", {
      method: "POST",
      body: JSON.stringify({ professor: state.professor, model: chosenModel }),
    });
    state.conversationId = conv.id;
    state.conversationModel = conv.model;
    await loadConversations();
  }
  input.value = "";
  clearPendingAttachment();
  appendPendingMessage(text, attachment);
  const sendBtn = document.getElementById("send-btn");
  sendBtn.disabled = true;
  const box = document.getElementById("messages");
  let assistantDiv = null;
  try {
    const model = chosenModel;
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        professor: state.professor, conversation_id: state.conversationId, message: text, model, attachment,
      }),
    });
    if (!res.ok) { throw new Error(await res.text()); }

    // Server-Sent Events, parsed by hand rather than with EventSource
    // (EventSource only supports GET, and this needs a POST body). Each
    // event is one "data: {...}\n\n" block; a read can land mid-event, so
    // leftover text is buffered until the next chunk completes it.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const raw of events) {
        const line = raw.trim();
        if (!line.startsWith("data:")) continue;
        const event = JSON.parse(line.slice(5).trim());
        if (event.type === "delta") {
          if (!assistantDiv) {
            // First piece of the reply has arrived — the "waiting..." bubble's job is done.
            const waiting = box.querySelector(".msg.user .meta.waiting");
            if (waiting) waiting.remove();
            assistantDiv = document.createElement("div");
            assistantDiv.className = "msg assistant";
            box.appendChild(assistantDiv);
          }
          assistantDiv.textContent += event.text;
          box.scrollTop = box.scrollHeight;
        } else if (event.type === "done") {
          // Authoritative re-render (adds the model/cost meta line, and
          // matches exactly what's now saved server-side).
          renderMessages(event.conversation);
          state.conversationModel = event.conversation.model;
          state.conversationHasMessages = event.conversation.messages.length > 0;
          await Promise.all([loadUsage(), loadConversations()]);
        } else if (event.type === "error") {
          throw new Error(event.message);
        }
      }
    }
  } catch (e) {
    alert("Error sending message: " + e.message);
    // The user's message was already saved server-side before streaming
    // began, so resync from the server instead of leaving a stranded
    // "waiting..." or partial assistant bubble on screen.
    await openConversation(state.conversationId);
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById("lock-btn").addEventListener("click", async () => {
  await fetch("/lock", { method: "POST" });
  window.location.href = "/";
});
// ── Settings modal ──────────────────────────────────────────────────────
function openSettingsModal() {
  const backdrop = document.getElementById("settings-modal-backdrop");
  const iframe = document.getElementById("settings-iframe");
  iframe.src = "/settings";
  backdrop.hidden = false;
  // Set src and un-hide first, then add the class on the next frame so the
  // opacity/transform transition actually plays instead of jumping straight
  // to its end state.
  requestAnimationFrame(() => backdrop.classList.add("open"));
}

function closeSettingsModal() {
  const backdrop = document.getElementById("settings-modal-backdrop");
  const iframe = document.getElementById("settings-iframe");
  backdrop.classList.remove("open");
  setTimeout(() => {
    backdrop.hidden = true;
    iframe.src = "about:blank";
  }, 200);
  // Settings changes (a professor added/removed, a model catalog edit,
  // etc.) may have happened inside the modal — refresh this page's own
  // state the same way a full reload of chat.html would, without actually
  // reloading it.
  loadProfessors().then(() => Promise.all([loadModels(), loadConversations(), loadUsage()]));
}

document.getElementById("settings-btn").addEventListener("click", openSettingsModal);
document.getElementById("settings-modal-close").addEventListener("click", closeSettingsModal);
document.getElementById("settings-modal-backdrop").addEventListener("click", (e) => {
  if (e.target.id === "settings-modal-backdrop") closeSettingsModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.getElementById("settings-modal-backdrop").hidden) {
    closeSettingsModal();
  }
});
document.getElementById("spend-toggle-btn").addEventListener("click", () => {
  const btn = document.getElementById("spend-toggle-btn");
  const hidden = document.body.classList.toggle("spend-hidden");
  btn.classList.toggle("collapsed", hidden);
  btn.title = hidden ? "Show spend panel" : "Hide spend panel";
});

(async function init() {
  await loadProfessors();
  await Promise.all([loadModels(), loadConversations(), loadUsage()]);
})();
</script>
