<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Princeton AI Sandbox</title>
<style>
  :root {
    --orange: #E77500;
    --border: #d2d2d7;
    --bg: #f5f5f7;
    --panel-bg: #ffffff;
    --input-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --active-bg: #fdeadb;
    --hover-bg: #eeeef0;
    --shadow: rgba(0, 0, 0, 0.14);
  }
  [data-theme="dark"] {
    --border: #3a3a3c;
    --bg: #1c1c1e;
    --panel-bg: #262628;
    --input-bg: #1c1c1e;
    --text: #f2f2f7;
    --text-muted: #9a9a9e;
    --active-bg: #4a2f14;
    --hover-bg: #333335;
    --shadow: rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; height: 100vh;
         display: grid; grid-template-columns: 240px 1fr 280px; background: var(--bg); color: var(--text); }
  #sidebar, #spend { background: var(--panel-bg); border-right: 1px solid var(--border); padding: 1rem; overflow-y: auto; }
  #spend { border-right: none; border-left: 1px solid var(--border); transition: margin-right 0.15s; }
  #spend.hidden { display: none; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 1rem 0 0.4rem; }
  h2:first-child { margin-top: 0; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0 0.4rem; }
  .section-header h2 { margin: 0; }
  select, input[type=text], textarea {
    width: 100%; padding: 0.45rem; font-size: 0.9rem; border: 1px solid var(--border);
    border-radius: 6px; background: var(--input-bg); color: var(--text); font-family: inherit;
  }
  .conv-item { padding: 0.5rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 0.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item:hover { background: var(--hover-bg); }
  .conv-item.active { background: var(--active-bg); }
  button { padding: 0.5rem 0.8rem; font-size: 0.85rem; background: var(--orange); color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #cc6600; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--hover-bg); }
  button:disabled { opacity: 0.5; cursor: default; }

  .plus-btn {
    width: 24px; height: 24px; padding: 0; border-radius: 50%; flex: none;
    font-size: 1rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; border-radius: 6px; flex: none;
    background: transparent; border: none; color: var(--text); cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover-bg); }
  .icon-btn.neutral { color: var(--text-muted); }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .icon-btn .icon-moon { display: none; }
  [data-theme="dark"] .icon-btn .icon-sun { display: none; }
  [data-theme="dark"] .icon-btn .icon-moon { display: block; }
  .icon-btn.collapsed .panel-fill { fill: none; }

  #main { display: flex; flex-direction: column; height: 100vh; }
  #topbar { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); background: var(--panel-bg); }
  .model-picker { flex: 1; display: flex; gap: 0.4rem; min-width: 0; }

  .combobox { position: relative; flex: 1; min-width: 0; }
  .combobox input.model-field { padding-right: 1.9rem; }
  .combobox-toggle {
    position: absolute; right: 0.35rem; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0; background: transparent; border: none; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .combobox-toggle:hover { background: transparent; color: var(--text); }
  .combobox-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 260px; overflow-y: auto;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 18px var(--shadow); z-index: 20; padding: 0.25rem; margin: 0;
  }
  .combobox-option { padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .combobox-option:hover { background: var(--hover-bg); }

  .model-add { position: relative; }
  .model-add-popover {
    position: absolute; top: calc(100% + 4px); right: 0; width: 230px; display: flex; gap: 0.4rem;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 18px var(--shadow); z-index: 20; padding: 0.5rem;
  }
  .model-add-popover input { padding: 0.4rem; font-size: 0.82rem; }
  .model-add-popover button { padding: 0.4rem 0.6rem; font-size: 0.8rem; flex: none; }

  #messages { flex: 1; overflow-y: auto; padding: 1.5rem; }
  .msg { max-width: 70%; margin-bottom: 1rem; padding: 0.7rem 0.9rem; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; font-size: 0.92rem; }
  .msg.user { background: var(--orange); color: white; margin-left: auto; }
  .msg.assistant { background: var(--panel-bg); border: 1px solid var(--border); }
  .msg .meta { font-size: 0.72rem; opacity: 0.7; margin-top: 0.35rem; }
  .msg .meta.waiting { font-style: italic; }
  #composer { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--border); background: var(--panel-bg); }
  #composer textarea { flex: 1; resize: none; height: 2.6rem; }
  .spend-figure { font-size: 1.6rem; font-weight: 600; }
  .spend-label { font-size: 0.78rem; color: var(--text-muted); }
  .spend-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.2rem 0; }
  .empty { color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 2rem; }
</style>
</head>
<body>
  <div id="sidebar">
    <h2>Professor</h2>
    <select id="professor-select"></select>

    <div class="section-header">
      <h2>Conversations</h2>
      <button id="new-conv" class="plus-btn" title="New conversation" aria-label="New conversation">+</button>
    </div>
    <div id="conv-list"></div>

    <h2>Session</h2>
    <button class="secondary" id="settings-btn" style="width:100%; margin-bottom:0.4rem">Settings</button>
    <button class="secondary" id="lock-btn" style="width:100%">Lock</button>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="model-picker">
        <div class="combobox" id="model-combobox">
          <input class="model-field" id="model-field" type="text"
                 placeholder="Model (e.g. gpt-4o, anthropic/claude-fable-5)" autocomplete="off">
          <button type="button" class="combobox-toggle" id="model-toggle-btn" aria-label="Show model list" title="Show model list">
            <svg viewBox="0 0 10 6" width="10" height="6">
              <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="combobox-list" id="model-list" hidden></div>
        </div>
        <div class="model-add" id="model-add">
          <button type="button" class="icon-btn neutral" id="model-add-btn" title="Use a custom model" aria-label="Use a custom model">+</button>
          <div class="model-add-popover" id="model-add-popover" hidden>
            <input type="text" id="model-add-input" placeholder="e.g. openai/gpt-4o" autocomplete="off">
            <button type="button" id="model-add-confirm">Use</button>
          </div>
        </div>
      </div>
      <button class="icon-btn" id="theme-toggle-btn" title="Switch to dark mode" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="10" cy="10" r="3.6"/>
          <path d="M10 1.6v2.1M10 16.3v2.1M18.4 10h-2.1M3.7 10H1.6M15.6 4.4l-1.5 1.5M5.9 14.1l-1.5 1.5M15.6 15.6l-1.5-1.5M5.9 5.9L4.4 4.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M16.2 12.9A7 7 0 018 3.9c.2-.4-.2-.9-.6-.8A8 8 0 1017 13.6c.1-.5-.4-.9-.8-.7z"/>
        </svg>
      </button>
      <button class="icon-btn" id="spend-toggle-btn" title="Hide spend panel" aria-label="Toggle spend panel">
        <svg viewBox="0 0 18 18">
          <rect x="1.5" y="2.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <rect class="panel-fill" x="11.5" y="2.5" width="5" height="13" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div id="messages"><div class="empty">Select or start a conversation.</div></div>
    <div id="composer">
      <textarea id="input" placeholder="Message..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <div id="spend">
    <h2>This month</h2>
    <div class="spend-figure" id="spend-month">$0.00</div>
    <div class="spend-label" id="spend-budget"></div>
    <h2>All time</h2>
    <div class="spend-figure" id="spend-alltime">$0.00</div>
    <h2>By model (this month)</h2>
    <div id="spend-by-model"></div>
  </div>

<script>
const state = {
  professor: null, conversationId: null, conversationModel: null, conversationHasMessages: false,
  models: [], defaultModel: null,
};

// ── Dark mode ────────────────────────────────────────────────────────────
// Applied immediately (before the rest of init) so there's no flash of the
// wrong theme on load. Preference is stored per-browser in localStorage —
// there's no server-side concept of "this professor's theme," it's purely
// a local display setting, so localStorage is the right place for it.
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("theme-toggle-btn");
  if (btn) btn.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
}
applyTheme(
  localStorage.getItem("theme")
  || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
);
document.getElementById("theme-toggle-btn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("theme", next);
  applyTheme(next);
});

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
  if (!res.ok) { throw new Error(await res.text()); }
  return res.json();
}

function fmtMoney(v) { return "$" + (v || 0).toFixed(2); }

async function loadProfessors() {
  const data = await api("/api/professors");
  const sel = document.getElementById("professor-select");
  sel.innerHTML = "";
  data.professors.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.safe_name; opt.textContent = p.name;
    sel.appendChild(opt);
  });
  state.professor = data.active || (data.professors[0] && data.professors[0].safe_name);
  if (state.professor) sel.value = state.professor;
  sel.addEventListener("change", async () => {
    state.professor = sel.value;
    await api("/api/active-professor", { method: "POST", body: JSON.stringify({ professor: state.professor }) });
    state.conversationId = null;
    await Promise.all([loadConversations(), loadUsage(), loadModels()]);
    renderMessages(null);
  });
}

// ── Model picker ─────────────────────────────────────────────────────────
// A hand-rolled combobox instead of <input list="..."> + <datalist>: the
// datalist popup is rendered entirely by the OS/browser chrome, not by our
// CSS, so it doesn't pick up this page's theme at all (that's what made it
// look like a stray light-mode box in dark mode). This version is just a
// plain text input (still freely editable — typing an exact model name,
// including "provider/model" auto-register syntax, works exactly as
// before) plus a custom-styled dropdown list we fully control.
async function loadModels() {
  const data = await api("/api/models?professor=" + encodeURIComponent(state.professor));
  state.models = data.models;
  state.defaultModel = data.default;
  renderModelList();
  const field = document.getElementById("model-field");
  if (!field.value) field.value = data.default || "";
}

function renderModelList() {
  const list = document.getElementById("model-list");
  list.innerHTML = "";
  state.models.forEach(m => {
    const opt = document.createElement("div");
    opt.className = "combobox-option";
    opt.textContent = m.name;
    opt.addEventListener("click", () => {
      document.getElementById("model-field").value = m.name;
      closeModelList();
    });
    list.appendChild(opt);
  });
}

function filterModelList() {
  const query = document.getElementById("model-field").value.toLowerCase();
  document.querySelectorAll("#model-list .combobox-option").forEach(opt => {
    opt.style.display = opt.textContent.toLowerCase().includes(query) ? "" : "none";
  });
}

function openModelList() { document.getElementById("model-list").hidden = false; }
function closeModelList() { document.getElementById("model-list").hidden = true; }

document.getElementById("model-toggle-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  const list = document.getElementById("model-list");
  if (list.hidden) { filterModelList(); openModelList(); } else { closeModelList(); }
});
document.getElementById("model-field").addEventListener("input", () => {
  filterModelList();
  openModelList();
});
document.getElementById("model-field").addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModelList();
});

// "+" next to the model field: a small in-app popover for typing a custom
// model name, rather than relying on people discovering that the combobox
// text field itself accepts free text.
function openModelAddPopover() {
  document.getElementById("model-add-popover").hidden = false;
  const input = document.getElementById("model-add-input");
  input.value = "";
  input.focus();
}
function closeModelAddPopover() { document.getElementById("model-add-popover").hidden = true; }
function confirmModelAdd() {
  const val = document.getElementById("model-add-input").value.trim();
  if (val) document.getElementById("model-field").value = val;
  closeModelAddPopover();
}
document.getElementById("model-add-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  const pop = document.getElementById("model-add-popover");
  if (pop.hidden) openModelAddPopover(); else closeModelAddPopover();
});
document.getElementById("model-add-confirm").addEventListener("click", confirmModelAdd);
document.getElementById("model-add-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); confirmModelAdd(); }
  if (e.key === "Escape") closeModelAddPopover();
});

document.addEventListener("click", (e) => {
  if (!document.getElementById("model-combobox").contains(e.target)) closeModelList();
  if (!document.getElementById("model-add").contains(e.target)) closeModelAddPopover();
});

async function loadConversations() {
  const data = await api("/api/conversations?professor=" + encodeURIComponent(state.professor));
  const list = document.getElementById("conv-list");
  list.innerHTML = "";
  data.conversations.forEach(c => {
    const div = document.createElement("div");
    div.className = "conv-item" + (c.id === state.conversationId ? " active" : "");
    div.textContent = c.title;
    div.title = c.title;
    div.addEventListener("click", () => openConversation(c.id));
    list.appendChild(div);
  });
}

async function loadUsage() {
  const data = await api("/api/usage?professor=" + encodeURIComponent(state.professor));
  document.getElementById("spend-month").textContent = fmtMoney(data.month.total_cost);
  document.getElementById("spend-alltime").textContent = fmtMoney(data.all_time.total_cost);
  document.getElementById("spend-budget").textContent =
    data.budget.monthly_limit ? `of ${fmtMoney(data.budget.monthly_limit)} budget (${data.budget.usage_percentage.toFixed(0)}%)` : "";
  const byModel = document.getElementById("spend-by-model");
  byModel.innerHTML = "";
  Object.entries(data.model_usage || {}).forEach(([model, stats]) => {
    const row = document.createElement("div");
    row.className = "spend-row";
    row.innerHTML = `<span>${model}</span><span>${fmtMoney(stats.total_cost)}</span>`;
    byModel.appendChild(row);
  });
}

function renderMessages(conv) {
  const box = document.getElementById("messages");
  if (!conv) { box.innerHTML = '<div class="empty">Select or start a conversation.</div>'; return; }
  box.innerHTML = "";
  conv.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.textContent = m.content;
    if (m.role === "assistant" && m.cost != null) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${m.model} · ${fmtMoney(m.cost)}`;
      div.appendChild(meta);
    }
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function openConversation(id) {
  state.conversationId = id;
  const conv = await api(`/api/conversations/${id}?professor=${encodeURIComponent(state.professor)}`);
  state.conversationModel = conv.model;
  state.conversationHasMessages = conv.messages.length > 0;
  document.getElementById("model-field").value = conv.model;
  renderMessages(conv);
  await loadConversations();
}

document.getElementById("new-conv").addEventListener("click", async () => {
  const model = document.getElementById("model-field").value || state.defaultModel;
  const conv = await api("/api/conversations", {
    method: "POST",
    body: JSON.stringify({ professor: state.professor, model }),
  });
  state.conversationId = conv.id;
  state.conversationModel = conv.model;
  state.conversationHasMessages = false;
  renderMessages(conv);
  await loadConversations();
});

function appendPendingMessage(text) {
  const box = document.getElementById("messages");
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg user";
  div.textContent = text;
  const meta = document.createElement("div");
  meta.className = "meta waiting";
  meta.textContent = "waiting...";
  div.appendChild(meta);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  const chosenModel = document.getElementById("model-field").value || state.defaultModel;
  if (state.conversationHasMessages && state.conversationModel && chosenModel !== state.conversationModel) {
    const proceed = confirm(
      `This conversation has been using "${state.conversationModel}". ` +
      `Switching to "${chosenModel}" now won't change anything the model already said — ` +
      `the new model didn't generate those earlier replies, so it may answer inconsistently ` +
      `with them or not "remember" details the same way.\n\nSend with "${chosenModel}" anyway?`
    );
    if (!proceed) return;
  }

  if (!state.conversationId) {
    const conv = await api("/api/conversations", {
      method: "POST",
      body: JSON.stringify({ professor: state.professor, model: chosenModel }),
    });
    state.conversationId = conv.id;
    state.conversationModel = conv.model;
    await loadConversations();
  }
  input.value = "";
  appendPendingMessage(text);
  const sendBtn = document.getElementById("send-btn");
  sendBtn.disabled = true;
  const box = document.getElementById("messages");
  let assistantDiv = null;
  try {
    const model = chosenModel;
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ professor: state.professor, conversation_id: state.conversationId, message: text, model }),
    });
    if (!res.ok) { throw new Error(await res.text()); }

    // Server-Sent Events, parsed by hand rather than with EventSource
    // (EventSource only supports GET, and this needs a POST body). Each
    // event is one "data: {...}\n\n" block; a read can land mid-event, so
    // leftover text is buffered until the next chunk completes it.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const raw of events) {
        const line = raw.trim();
        if (!line.startsWith("data:")) continue;
        const event = JSON.parse(line.slice(5).trim());
        if (event.type === "delta") {
          if (!assistantDiv) {
            // First piece of the reply has arrived — the "waiting..." bubble's job is done.
            const waiting = box.querySelector(".msg.user .meta.waiting");
            if (waiting) waiting.remove();
            assistantDiv = document.createElement("div");
            assistantDiv.className = "msg assistant";
            box.appendChild(assistantDiv);
          }
          assistantDiv.textContent += event.text;
          box.scrollTop = box.scrollHeight;
        } else if (event.type === "done") {
          // Authoritative re-render (adds the model/cost meta line, and
          // matches exactly what's now saved server-side).
          renderMessages(event.conversation);
          state.conversationModel = event.conversation.model;
          state.conversationHasMessages = event.conversation.messages.length > 0;
          await Promise.all([loadUsage(), loadConversations()]);
        } else if (event.type === "error") {
          throw new Error(event.message);
        }
      }
    }
  } catch (e) {
    alert("Error sending message: " + e.message);
    // The user's message was already saved server-side before streaming
    // began, so resync from the server instead of leaving a stranded
    // "waiting..." or partial assistant bubble on screen.
    await openConversation(state.conversationId);
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById("lock-btn").addEventListener("click", async () => {
  await fetch("/lock", { method: "POST" });
  window.location.href = "/";
});
document.getElementById("settings-btn").addEventListener("click", () => {
  window.location.href = "/settings";
});
document.getElementById("spend-toggle-btn").addEventListener("click", () => {
  const panel = document.getElementById("spend");
  const btn = document.getElementById("spend-toggle-btn");
  const hidden = panel.classList.toggle("hidden");
  btn.classList.toggle("collapsed", hidden);
  btn.title = hidden ? "Show spend panel" : "Hide spend panel";
});

(async function init() {
  await loadProfessors();
  await Promise.all([loadModels(), loadConversations(), loadUsage()]);
})();
</script>
</body>
</html>
