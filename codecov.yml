# Which files count is decided in .coveragerc, not here: an `ignore:` list in
# this file would be a second list, and the two would drift apart.
coverage:
  status:
    project:
      default:
        target: auto         # compare each push with the commit it builds on
        threshold: 1%        # and fail if coverage falls by more than this
    patch:
      default:
        target: 85%          # new code in each PR should be ≥85% covered

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false     # always post a comment on PRs
