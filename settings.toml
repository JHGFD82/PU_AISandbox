# settings.toml — User-customizable runtime settings for PU AI Sandbox
# Edit this file to change default behavior. Changes take effect on the next run.
# Default models are in src/model_catalog.json under [config.defaults].

[prompt]
temperature = 0.7          # More creative than translation — suitable for open-ended prompts
top_p = 1.0                # Full nucleus sampling
max_tokens = 4000
default_system_prompt = "You are a helpful assistant."

[retry]
page_delay_seconds = 3.0   # Seconds to pause between pages in sequential mode
max_retries = 10           # Maximum retry attempts on transient errors or content filter
base_retry_delay = 3.0     # Base seconds for exponential backoff (delay = base * 2^attempt)

[processing]
default_parallel_workers = 1  # Default -w/--workers value; 1 = sequential (safe default)
default_ocr_passes = 1        # Default -P/--passes value; >1 enables multi-pass OCR refinement
default_page_size = 2000      # Target characters per logical page when splitting DOCX/TXT files
max_parallel_workers = 50     # Hard cap on concurrent workers to avoid OS file-descriptor exhaustion

[output]
default_font_size = 9         # Default body font size (points) for PDF and Word output

[budget]
warning_threshold_pct = 80    # Warn when monthly spend exceeds this percentage of the limit

# ── API endpoints ──────────────────────────────────────────────────────────────
# Define named API endpoints here.  Each subsection name becomes the --api
# identifier on the CLI (e.g. --api pu_sandbox) and the colon prefix in the
# -m/--model flag (e.g. -m pu_sandbox:gpt-4o or -m della:qwen-preview).
#
# Optional: set a default API so bare model names are routed there automatically.
# When unset (commented out), bare model names use the built-in Portkey service.
#
# [apis]
# default = "pu_sandbox"   # Route all bare -m values here by default
#
# The API key for each entry must be set in your .env file as:
#   EXTERNAL_API_<UPPERCASE_NAME>_KEY=your_key
# (e.g. EXTERNAL_API_PU_SANDBOX_KEY=...)
#
# Available fields per entry:
#   name              Human-readable label shown in --list-apis output
#   base_url          Root URL for the API (required)
#   openai_compatible Set true for OpenAI-compatible LLM endpoints (clusters, providers)
#   default_model     Default model name for openai_compatible endpoints
#   timeout           Request timeout in seconds (default: 30)
#   verify_ssl        Set false to disable SSL verification (default: true)
#
# Example — PU AI Sandbox (OpenAI-compatible):
# [apis.pu_sandbox]
# name = "PU AI Sandbox"
# base_url = "https://api.aisandbox.princeton.edu/v1"
# openai_compatible = true
# default_model = "gpt-4o"
#
# Example — self-hosted model cluster (OpenAI-compatible):
# [apis.my_cluster]
# name = "My GPU Cluster"
# base_url = "http://my-cluster.example.com:8000/v1"
# openai_compatible = true
# default_model = "llama-3-70b"
# verify_ssl = false
#
# Example — generic REST API (non-OpenAI-compatible):
# [apis.data_service]
# name = "Research Data Service"
# base_url = "https://api.myresearch.edu"
# openai_compatible = false
# timeout = 60
