[pytest]
testpaths = tests plugins/translation/tests plugins/prompt/tests plugins/transcription/tests plugins/webui/tests
pythonpath = .
# Each test file is imported under a name made from its whole path, so two
# files may share a name in different folders — each plugin has its own
# test_plugin.py, for instance. Under pytest's default, the second one found
# would be refused for clashing with the first.
addopts = --import-mode=importlib
markers =
    live: tests that make real HTTP calls to external APIs (PortKey pricing endpoint)
