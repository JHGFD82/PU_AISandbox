# settings.default.toml — Repo-shipped runtime defaults for PU AI Sandbox.
# Edit this file only if you're changing the default for everyone who clones
# this repo. For your own machine, use preferences.toml in your own files
# folder instead (see docs/configuration.md) — it overrides just the keys you
# put in it, without touching this file. Default models are in
# model_catalog.json, alongside preferences.toml, under [config.defaults].
#
# [endpoints.<name>] and [config].default_endpoint belong in preferences.toml,
# or in a shared settings file — not here. This file is inside the package: it
# is tracked by git, replaced whenever the sandbox is updated, and committable
# by accident, so an endpoint put here is lost on the next update or published
# by mistake. Its credential may sit in the same table, or in settings.toml,
# which is private to one installation and wins when both are set. See
# "Alternate AI endpoints" in docs/configuration.md.

[prompt]
temperature = 0.7          # More creative than translation — suitable for open-ended prompts
top_p = 1.0                # Full nucleus sampling
max_tokens = 4000
default_system_prompt = "You are a helpful assistant."

[retry]
page_delay_seconds = 3.0   # Seconds to pause between pages in sequential mode
max_retries = 10           # Maximum retry attempts on transient errors or content filter
retry_delay_seconds = 5.0  # Flat seconds to wait between retries (not doubled each time)
# How long to wait for a provider that has gone quiet before giving up on a
# request. Generous, because a full page of dense text can genuinely take
# minutes to come back and cutting that off would break real work — but not
# unlimited, because without it a provider that simply stops answering leaves a
# translation waiting for something that is never coming.
request_timeout_seconds = 300.0

[processing]
default_parallel_workers = 1  # Default -w/--workers value; 1 = sequential (safe default)
default_page_size = 2000      # Target characters per logical page when splitting DOCX/TXT files
max_parallel_workers = 50     # Hard cap on concurrent workers to avoid OS file-descriptor exhaustion

[output]
default_font_size = 9         # Default body font size (points) for PDF and Word output

[budget]
warning_threshold_pct = 80    # Warn when monthly spend exceeds this percentage of the limit
