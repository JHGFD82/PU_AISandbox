# Runs the test suite on every push and sends Codecov two things: how much of
# the code the tests reach, and which tests passed or failed.
#
# What counts as "the code" is decided in .coveragerc alone, which is why the
# pytest line below says plain `--cov` and names no folder.
name: Upload to Codecov

on: [push]

jobs:
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the tests
        run: |
          pytest -m "not live" --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: JHGFD82/PU_AISandbox
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
